databases:
  - name: shopify-crm-db
    databaseName: shopify_order_crm
    user: postgres
    plan: free

services:
  # ----------------------------------------------------
  # 1. Backend API Web Service
  # ----------------------------------------------------
  - type: web
    name: shopify-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    preDeployCommand: npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-crm-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: shopify-crm-frontend
          property: host
      - key: SHOPIFY_APP_URL
        fromService:
          type: web
          name: shopify-crm-backend
          property: host
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2024-10
      - key: SHOPIFY_SCOPES
        value: read_orders,write_orders,read_customers,read_products
      - key: SHOPIFY_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_NAME
        value: Super Admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: Admin@Password123

  # ----------------------------------------------------
  # 2. Frontend React Client (Static Site)
  # ----------------------------------------------------
  - type: web
    name: shopify-crm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: shopify-crm-backend
          property: host
